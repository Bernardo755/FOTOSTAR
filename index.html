<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0062ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Captura Fotos</title>
<style>
:root{--primary:#0062ff;--bg:#f2f4f7;--surface:#fff;--text:#111827;--text-sec:#6b7280;--border:#e5e7eb}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;touch-action:manipulation}
#app{background:var(--surface);width:100%;max-width:480px;padding:24px;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.05);box-sizing:border-box;margin-top:10px}
h2{margin:0 0 8px;font-size:22px}
h3{margin:16px 0 12px;font-size:16px;color:var(--text-sec)}
p,small{color:var(--text-sec);font-size:14px;margin:4px 0;line-height:1.4;display:block}
.input-group{margin-bottom:12px}.input-group small{margin-bottom:6px;font-weight:500;color:var(--text)}
input{width:100%;box-sizing:border-box;font-size:16px;padding:14px 16px;border-radius:12px;border:2px solid var(--border);background:#f9fafb;color:var(--text);appearance:none}
input:focus{outline:none;border-color:var(--primary);background:#fff}
button{width:100%;box-sizing:border-box;font-size:16px;font-weight:600;padding:16px;margin-bottom:12px;border-radius:12px;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
button.o{background:transparent;color:var(--primary);border:2px solid var(--primary)}
button.r{background:transparent;color:#dc2626;border:2px solid #dc2626}
button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.5}
img,video{width:100%;border-radius:12px;background:#000;margin-bottom:16px;aspect-ratio:4/3;object-fit:cover}
.info-card{background:#f8fafc;border:1px solid var(--border);padding:16px;border-radius:12px;margin-bottom:20px}
.info-card h2{font-size:18px;color:var(--primary)}
.badge-container{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.badge{background:#e0e7ff;color:#3730a3;font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-2 button{margin-bottom:0}
a{text-decoration:none}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--surface:#161b26;--text:#f3f4f6;--text-sec:#9ca3af;--border:#2a3140}input{background:#0f141d}.info-card{background:#0f141d}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script>
const $ = s => document.querySelector(s), app = $('#app'), cam = $('#cam');
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv');
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
const clean = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '') || 'SN';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RX = /[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[A-Z0-9][0-9]/;
const PASOS = [['INE_FRENTE','FRENTE del INE'],['INE_REVERSO','REVERSO del INE'],['CONTRATO','CONTRATO completo'],['ENTREGA','ENTREGA'],['CURP','CURP']];
const pasos = n => n == 'EMS' ? PASOS : PASOS.slice(0, 4);
const mb = b => (b / 1048576).toFixed(1) + ' MB';

// ---- IndexedDB (las fotos viven en disco, no en RAM) ----
const db = new Promise((ok, no) => { const r = indexedDB.open('captura', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => ok(r.result); r.onerror = no; });
const tx = async (m, f) => { const d = await db; return new Promise((ok, no) => { const t = d.transaction('f', m); const q = f(t.objectStore('f')); t.oncomplete = () => ok(q && q.result); t.onerror = no; }); };
const put = (k, v) => tx('readwrite', s => s.put(v, k));
const keys = () => tx('readonly', s => s.getAllKeys());
const get = k => tx('readonly', s => s.get(k));
const del = k => tx('readwrite', s => s.delete(k));

// ---- ZIP por streaming: CRC por trozos de 1 MB y los Blobs se referencian, no se copian ----
const CT = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
async function crcBlob(b) {
  let c = 0xFFFFFFFF;
  for (let o = 0; o < b.size; o += 1048576) {
    const u = new Uint8Array(await b.slice(o, o + 1048576).arrayBuffer());
    for (let i = 0; i < u.length; i++) c = CT[(c ^ u[i]) & 255] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function zipBlobs(files, prog) { // files: [{name, blob}]
  const enc = new TextEncoder(), parts = [], cd = [];
  let off = 0, total = 0;
  const d = new Date();
  const dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => total += f.blob.size);
  if (total > 3.9e9 || files.length > 65000) throw new Error('El ZIP supera 4 GB. Envía la evidencia más seguido.');
  let i = 0;
  for (const f of files) {
    prog && prog(++i, files.length);
    const n = enc.encode(f.name), s = f.blob.size, c = await crcBlob(f.blob);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, c, true);
    h.setUint32(18, s, true); h.setUint32(22, s, true); h.setUint16(26, n.length, true);
    parts.push(h, n, f.blob);
    const e = new DataView(new ArrayBuffer(46));
    e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x800, true);
    e.setUint16(12, dt, true); e.setUint16(14, dd, true); e.setUint32(16, c, true);
    e.setUint32(20, s, true); e.setUint32(24, s, true); e.setUint16(28, n.length, true); e.setUint32(42, off, true);
    cd.push(e, n);
    off += 30 + n.length + s;
  }
  let cs = 0; cd.forEach(x => cs += x.byteLength);
  const z = new DataView(new ArrayBuffer(22));
  z.setUint32(0, 0x06054b50, true); z.setUint16(8, files.length, true); z.setUint16(10, files.length, true);
  z.setUint32(12, cs, true); z.setUint32(16, off, true);
  return new Blob([...parts, ...cd, z], { type: 'application/zip' });
}

// ---- estado ----
let S = JSON.parse(localStorage.sesion || 'null');
let R = { nivel: '', curp: '', i: 0, pend: null, stamp: '' };
let stream, timer, Z = null;

const vigente = () => S && S.creadoEl == today();
const carpeta = () => S.carpeta || (clean(S.sede) + '_' + S.fecha); // carpeta del día
const persona = () => `${R.nivel}_${R.curp}_${R.stamp}_${clean(S.capturista)}`; // carpeta por persona
const stopCam = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
const freeZ = () => { if (Z) Z.forEach(z => URL.revokeObjectURL(z.url)); Z = null; };
const go = (f, ...a) => { stopCam(); app.innerHTML = ''; f(...a); };
const btn = (id, t, o) => `<button id="${id}" ${o ? `class="${o}"` : ''}>${t}</button>`;
const on = (id, f) => $('#' + id).onclick = f;
const metaKeys = async () => (await keys()).filter(k => k.startsWith('~meta/' + carpeta() + '/'));

function setup() {
  app.innerHTML = `
    <h2>${vigente() ? 'Editar Configuración' : 'Nueva Sesión'}</h2>
    <div class="input-group"><small>Sede (nombre de la carpeta)</small><input id="sede" placeholder="Ej. CDMX Centro" value="${esc(S?.sede)}"></div>
    <div class="input-group"><small>Quién entrega</small><input id="ent" placeholder="Ej. Juan Pérez" value="${esc(S?.entrega)}"></div>
    <div class="input-group"><small>Capturista</small><input id="cap" placeholder="Ej. María López" value="${esc(S?.capturista)}"></div>
    <div class="input-group"><small>Fecha de sesión</small><input id="fec" type="date" value="${vigente() ? S.fecha : today()}"></div>
    <br>${btn('ok', vigente() ? 'GUARDAR CAMBIOS' : 'CREAR CARPETA DEL DÍA')}${vigente() ? btn('cx', 'Cancelar', 'o') : ''}`;
  if (vigente()) on('cx', nivel);
  on('ok', () => {
    const v = i => $('#' + i).value.trim();
    if (!v('sede') || !v('cap') || !v('ent') || !v('fec')) return alert('Llena todos los campos');
    const prev = vigente() && S.carpeta ? S.carpeta : (vigente() ? carpeta() : null); // la carpeta del día no cambia al editar
    S = { sede: v('sede'), capturista: v('cap'), entrega: v('ent'), fecha: v('fec'), creadoEl: today() };
    S.carpeta = prev || (clean(S.sede) + '_' + S.fecha);
    localStorage.sesion = JSON.stringify(S);
    nivel();
  });
}

async function nivel() {
  freeZ();
  R = { nivel: '', curp: '', i: 0, pend: null, stamp: '' };
  const n = (await metaKeys()).length;
  const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
  app.innerHTML = `
    <div class="info-card">
      <h2>📍 Sede: ${esc(S.sede)}</h2>
      <p>👤 Capturista: <b>${esc(S.capturista)}</b></p>
      <p>📦 Entrega: <b>${esc(S.entrega)}</b></p>
      <p>📅 Fecha: ${esc(S.fecha)}</p>
      <p>🗂️ Personas capturadas hoy: <b>${n}</b></p>
      ${est ? `<p>💾 Almacenado en el teléfono: <b>${mb(est.usage || 0)}</b></p>` : ''}
    </div>
    <h3>Selecciona el nivel educativo</h3>
    ${['BASICA', 'EMS', 'JEF'].map(x => btn('n' + x, x)).join('')}
    <br>
    ${n ? btn('dia', '📦 ENVIAR EVIDENCIA DEL DÍA') : ''}
    ${btn('nuevo', 'EDITAR DATOS / NUEVA SESIÓN', 'o')}`;
  ['BASICA', 'EMS', 'JEF'].forEach(x => on('n' + x, () => { R.nivel = x; eleccion(); }));
  on('nuevo', setup);
  if (n) on('dia', enviarDia);
}

function eleccion() {
  app.innerHTML = `<h2>Nivel: ${R.nivel}</h2><h3>¿Cómo vas a ingresar la CURP?</h3>
    ${btn('man', '✍️ INGRESO MANUAL')}${btn('esc', '📷 ESCANEAR (QR / Código)')}<br>${btn('atr', 'Cambiar nivel', 'o')}`;
  on('man', () => { R.curp = ''; manual(); }); on('esc', escanear); on('atr', nivel);
}

function manual() {
  app.innerHTML = `<h2>Escribe la CURP</h2>
    <div class="input-group"><small id="n">0/18 caracteres</small>
    <input id="c" maxlength="18" autocapitalize="characters" autocomplete="off" placeholder="Ingresa los 18 caracteres" value="${esc(R.curp)}"></div>
    ${btn('go', 'CONTINUAR A FOTOS')}${btn('atr', 'Atrás', 'o')}`;
  const c = $('#c');
  const u = () => { c.value = c.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 18); R.curp = c.value; $('#n').textContent = c.value.length + '/18 caracteres'; $('#go').disabled = c.value.length != 18; };
  c.oninput = u; u();
  on('go', () => { R.i = 0; R.stamp = stamp(); foto(); }); // fecha y hora de inicio de la persona
  on('atr', eleccion);
}

async function escanear() {
  if (!('BarcodeDetector' in window)) { alert('Este navegador no tiene escáner automático. Usa captura manual.'); return manual(); }
  if (!navigator.mediaDevices) return fotoQR();
  app.innerHTML = `<h2>Apunta al código</h2><video id="v" playsinline muted></video>
    <small id="raw" style="text-align:center;margin-bottom:16px">Buscando código...</small>${btn('atr', 'Cancelar', 'o')}`;
  on('atr', eleccion);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#v'); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector();
    timer = setInterval(async () => {
      try {
        for (const b of await det.detect(v)) {
          const raw = (b.rawValue || '').toUpperCase(); $('#raw').textContent = 'Leído: ' + raw.slice(0, 50);
          const m = RX.exec(raw);
          if (m) { R.curp = m[0]; if (navigator.vibrate) navigator.vibrate(100); return go(manual); }
        }
      } catch (e) {}
    }, 300);
  } catch (e) { fotoQR(); }
}

const qr = document.createElement('input');
qr.type = 'file'; qr.accept = 'image/*'; qr.setAttribute('capture', 'environment');
qr.onchange = async () => {
  const f = qr.files[0]; qr.value = ''; if (!f) return;
  try {
    const bm = await createImageBitmap(f); let m = null;
    for (const b of await new BarcodeDetector().detect(bm)) { m = RX.exec((b.rawValue || '').toUpperCase()); if (m) break; }
    if (m) R.curp = m[0]; else alert('No se encontró una CURP válida. Intenta de nuevo o hazlo manual.');
  } catch (e) { alert('No se pudo leer. Intenta con captura manual.'); }
  manual();
};
function fotoQR() {
  app.innerHTML = `<h2>Escanear con foto</h2><small>Toma una foto clara del QR o código de barras.</small>
    ${btn('t', '📷 TOMAR FOTO DEL CÓDIGO')}${btn('atr', 'Atrás', 'o')}`;
  on('atr', eleccion); on('t', () => qr.click());
}

function foto() {
  const ps = pasos(R.nivel), p = ps[R.i];
  app.innerHTML = `
    <div class="badge-container"><span class="badge">${R.nivel}</span><span class="badge">${esc(R.curp)}</span><span class="badge">Paso ${R.i + 1}/${ps.length}</span></div>
    <h2>Toma foto del ${p[1]}</h2>
    ${R.pend ? `<img src="${R.pend.url}"><div class="grid-2">${btn('rep', '🔄 REPETIR', 'o')}${btn('ac', R.i + 1 < ps.length ? 'SIGUIENTE ➔' : 'FINALIZAR ✓')}</div>` : btn('tom', '📷 TOMAR FOTO')}`;
  if (!R.pend) return on('tom', () => cam.click());
  on('rep', () => { URL.revokeObjectURL(R.pend.url); R.pend = null; foto(); });
  on('ac', async () => {
    $('#ac').disabled = true; // evita doble toque
    await put(`${carpeta()}/${persona()}/${persona()}_${p[0]}.jpg`, R.pend.blob);
    URL.revokeObjectURL(R.pend.url); R.pend = null;
    if (R.i + 1 < ps.length) { R.i++; foto(); } else fin();
  });
}
const MAXPX = 2000, CALIDAD = 0.85; // ajusta si quieres más/menos peso
async function comprimir(f) {
  try {
    const bm = await createImageBitmap(f);
    const k = Math.min(1, MAXPX / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if (bm.close) bm.close();
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', CALIDAD)); c.width = c.height = 0;
    return b && b.size && b.size < f.size ? b : f;
  } catch (e) { return f; }
}
cam.onchange = async () => {
  const f = cam.files[0]; cam.value = ''; if (!f) return;
  app.innerHTML = '<h2>Procesando foto…</h2>';
  const b = await comprimir(f);
  R.pend = { blob: b, url: URL.createObjectURL(b) }; foto();
};

async function fin() {
  await put(`~meta/${carpeta()}/${persona()}`, JSON.stringify({
    sede: S.sede, fechaHora: new Date().toLocaleString('sv'), nivel: R.nivel, curp: R.curp,
    entrega: S.entrega, capturista: S.capturista, fotos: pasos(R.nivel).length, carpeta: persona()
  }));
  const n = (await metaKeys()).length;
  app.innerHTML = `
    <h2>¡Persona completa! 🎉</h2>
    <div class="info-card"><p><b>${R.nivel}</b> · ${esc(R.curp)}</p>
    <small>Guardada en la carpeta del día. Llevas <b>${n}</b> persona(s) hoy.</small></div>
    <h3>¿Quieres enviar la evidencia del día?</h3>
    ${btn('si', '📦 SÍ, ENVIAR EVIDENCIA DEL DÍA')}${btn('sig', 'NO, SIGUIENTE PERSONA', 'o')}`;
  on('si', enviarDia); on('sig', nivel);
}

const LIM = 500 * 1048576; // tamaño máximo por parte (~500 MB)
async function enviarDia() {
  freeZ();
  app.innerHTML = `<h2>Armando ZIP del día…</h2><small id="pg">Preparando…</small><small>No cierres esta pantalla.</small>`;
  try {
    const pre = carpeta() + '/';
    const ks = (await keys()).filter(k => k.startsWith(pre)).sort();
    if (!ks.length) { alert('No hay fotos guardadas hoy.'); return nivel(); }
    const metas = {};
    for (const k of await metaKeys()) { const m = JSON.parse(await get(k)); metas[m.carpeta] = m; }
    const grupos = {}; // una entrada por persona (carpeta CURP): nunca se parte una persona entre dos ZIP
    for (const k of ks) (grupos[k.split('/')[1]] = grupos[k.split('/')[1]] || []).push({ name: k, blob: await get(k) });
    const partes = []; let cur = null;
    for (const g of Object.keys(grupos)) {
      const sz = grupos[g].reduce((a, f) => a + f.blob.size, 0);
      if (!cur || (cur.size + sz > LIM && cur.gs.length)) { cur = { gs: [], size: 0 }; partes.push(cur); }
      cur.gs.push(g); cur.size += sz;
    }
    const st = stamp(); Z = [];
    for (let p = 0; p < partes.length; p++) {
      const files = [], rows = ['sede,fecha_hora,nivel,curp,entrega,capturista,fotos,carpeta'];
      for (const g of partes[p].gs) {
        files.push(...grupos[g]); const m = metas[g];
        if (m) rows.push([m.sede, m.fechaHora, m.nivel, m.curp, m.entrega, m.capturista, m.fotos, m.carpeta].map(x => `"${String(x).replace(/"/g, '""')}"`).join(','));
      }
      files.push({ name: pre + 'REGISTRO.csv', blob: new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv' }) });
      const fn = `EVIDENCIA_${carpeta()}_${st}_PARTE_${p + 1}-de-${partes.length}.zip`;
      const blob = await zipBlobs(files, (i, t) => { $('#pg').textContent = `Parte ${p + 1} de ${partes.length}: archivo ${i} de ${t}…`; });
      Z.push({ blob, fn, url: URL.createObjectURL(blob), file: new File([blob], fn, { type: 'application/zip' }), n: partes[p].gs.length });
    }
    listo();
  } catch (e) { alert('Error: ' + e.message); nivel(); }
}

function listo() {
  const tot = Z.reduce((a, z) => a + z.blob.size, 0), np = Z.reduce((a, z) => a + z.n, 0);
  app.innerHTML = `
    <h2>Evidencia lista ✅</h2>
    <small>${np} persona(s) · ${Z.length} ZIP · ${mb(tot)} en total. Envía <b>todas</b> las partes. Cada una trae su REGISTRO.csv.</small><br>
    ${Z.map((z, i) => `<div class="info-card"><p>📦 <b>Parte ${i + 1} de ${Z.length}</b> · ${z.n} personas · ${mb(z.blob.size)}</p><small style="word-break:break-all">${esc(z.fn)}</small><br>
      ${btn('sh' + i, '📤 COMPARTIR')}<a href="${z.url}" download="${esc(z.fn)}"><button class="o" style="margin:0">⬇️ DESCARGAR</button></a></div>`).join('')}
    <small>Si descargas, los archivos quedan en <b>Descargas</b> (iPhone: Archivos › Descargas) y de ahí los reenvías por donde quieras.</small><br>
    ${btn('bor', '🗑️ YA ENVIÉ TODAS LAS PARTES: BORRAR DEL DÍA', 'r')}${btn('vol', 'Volver (conservar fotos)', 'o')}`;
  Z.forEach((z, i) => on('sh' + i, async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [z.file] })) await navigator.share({ files: [z.file], title: z.fn });
      else alert('Tu navegador no permite compartir este ZIP directamente. Usa DESCARGAR.');
    } catch (e) { if (e.name !== 'AbortError') alert('No se pudo compartir: ' + e.message + '. Usa DESCARGAR.'); }
  }));
  on('vol', nivel);
  on('bor', async () => {
    if (!confirm(`¿Seguro? Se borrarán del teléfono TODAS las fotos del día. Hazlo solo si ya enviaste o descargaste las ${Z.length} parte(s).`)) return;
    for (const k of await keys()) if (k.startsWith(carpeta() + '/') || k.startsWith('~meta/' + carpeta() + '/')) await del(k);
    alert('Evidencia del día borrada.'); nivel();
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
vigente() ? nivel() : setup();
</script>
</body>
</html>
